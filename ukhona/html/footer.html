<style>
  /* ── level trail ── */
  .footer-level-trail {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin: 1.25rem 0 1rem;
  }

  .trail-dot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .35rem;
    text-decoration: none;
    position: relative;
  }

  .trail-pip {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--glass);
    transition: var(--transition);
    display: block;
  }

  .trail-dot[data-level="1"] .trail-pip { border-color: #4fc3f7; }
  .trail-dot[data-level="2"] .trail-pip { border-color: #69db7c; }
  .trail-dot[data-level="3"] .trail-pip { border-color: #ffd43b; }

  .trail-dot:hover .trail-pip,
  .trail-dot.active .trail-pip {
    transform: scale(1.4);
  }
  .trail-dot[data-level="1"]:hover .trail-pip,
  .trail-dot[data-level="1"].active .trail-pip { background: #4fc3f7; box-shadow: 0 0 8px #4fc3f7; }
  .trail-dot[data-level="2"]:hover .trail-pip,
  .trail-dot[data-level="2"].active .trail-pip { background: #69db7c; box-shadow: 0 0 8px #69db7c; }
  .trail-dot[data-level="3"]:hover .trail-pip,
  .trail-dot[data-level="3"].active .trail-pip { background: #ffd43b; box-shadow: 0 0 8px #ffd43b; }

  .trail-label {
    font-family: 'Inter', sans-serif;
    font-size: .55rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--text-secondary);
    opacity: .6;
    transition: var(--transition);
  }

  .trail-dot:hover .trail-label { opacity: 1; color: var(--text); }

  .trail-line {
    flex: 1;
    max-width: 80px;
    height: 1px;
    background: var(--border);
    margin: 0 .5rem;
    margin-bottom: 1.1rem; /* align with pip center */
  }
</style>

<script>
  (function () {
    function initTrail() {
      // Find the site root by walking up to where index.html lives
      const path = window.location.pathname;
      const rootMatch = path.match(/^(.*?\/who-i\/|.*?\/repos-00\/|\/)/);
      const root = rootMatch ? rootMatch[1] : '/';

      // Wire up trail dot hrefs
      document.querySelectorAll('.trail-dot[data-dest]').forEach(dot => {
        dot.href = root + dot.dataset.dest;
      });

      // Highlight current level
      const levelMatch = path.match(/level(\d)/);
      const active = levelMatch ? levelMatch[1] : null;
      document.querySelectorAll('.trail-dot').forEach(dot => {
        dot.classList.toggle('active', dot.dataset.level === active);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTrail);
    } else {
      initTrail();
    }
  })();
</script>
