  /* ── prev / next nav buttons ── */

    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
    font-size: .65rem;
    font-weight: 500;
    letter-spacing: .05em;
    cursor: pointer;
    transition: var(--transition);
    text-decoration: none;
  }

  .grid-nav-btn:hover {
    background: var(--primary-gradient);
    color: #fff;
    border-color: transparent;
    transform: translateY(-2px);
  }
</style>

<script>
  (function () {
    // Wait for DOM — this script runs inline after injection
    function initLevelGrid() {
      const lvlBtns  = document.querySelectorAll('.grid-lvl-btn');
      const navBtns  = document.querySelectorAll('.grid-nav-btn');
      const levels   = document.querySelectorAll('.grid-level');

      function switchTo(n) {
        const target = String(n);
        levels.forEach(l => l.classList.toggle('hidden', l.id !== `grid-level-${target}`));
        lvlBtns.forEach(b => b.classList.toggle('active', b.dataset.level === target));
      }

      lvlBtns.forEach(btn => btn.addEventListener('click', () => switchTo(btn.dataset.level)));
      navBtns.forEach(btn => btn.addEventListener('click', () => switchTo(btn.dataset.to)));
    }

    // shared.js injects this fragment, so the script may run before or after DOMContentLoaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLevelGrid);
    } else {
      initLevelGrid();
    }
  })();
</script>
