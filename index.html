<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tools for Literature Review · Ukubona</title>
  <meta name="description" content="AI Tools for Literature Review — Ukubona LLC">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-dark.ico" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-light.ico" media="(prefers-color-scheme: light)">
  <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-dark.png" as="image">
  <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-light.png" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter for the shell UI; Cormorant for the headline -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <link href="ukhona/css/variables.css?v=1.1" rel="stylesheet">
  <link href="ukhona/css/head.css?v=1.1" rel="stylesheet">
  <link href="ukhona/css/card.css?v=1.1" rel="stylesheet">
  <link href="ukhona/css/footer.css" rel="stylesheet">

  <style>
    /* ── layout shell (unchanged) ── */
    html { height: 100%; }
    body { min-height: 100%; display: flex; flex-direction: column; }

    .landing-stage {
      position: relative; z-index: 10; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; margin-top: var(--header-h);
      text-align: center; gap: 0;
    }

    .topo-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .topo-layer svg { width: 100%; height: 100%; opacity: .04; }
    @keyframes topoFloat {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(-12px, 8px); }
    }
    .topo-layer svg g { animation: topoFloat 32s ease-in-out infinite; }

    /* ══════════════════════════════════════
       HEADLINE BLOCK
       lives entirely inside .landing-stage
    ══════════════════════════════════════ */

    /* eyebrow */
    .lr-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      font-style: italic;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      /* pick up the site accent, fall back to a warm gold */
      color: var(--primary, #c9b99a);
      opacity: 0;
      margin-bottom: 2rem;
      animation: lrFadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.1s forwards;
    }

    /* headline */
    .lr-headline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      line-height: 1;
      margin: 0;
    }

    .lr-line {
      display: block;
      opacity: 0;
    }

    /* "AI" — enormous, italic */
    .lr-ai {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text, #f0ede6);
      letter-spacing: -0.02em;
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.25s forwards;
    }

    /* "Tools" — spaced caps, accent colour */
    .lr-tools {
      font-size: clamp(1.6rem, 5vw, 3.2rem);
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--primary, #c9b99a);
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.38s forwards;
      margin: 0.15em 0 0.3em;
    }

    /* "for" — quiet italic connector */
    .lr-for {
      font-size: clamp(0.85rem, 2vw, 1.2rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      color: var(--text-secondary, rgba(240,237,230,0.45));
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.5s forwards;
      margin-bottom: 0.15em;
    }

    /* "Literature" */
    .lr-lit {
      font-size: clamp(2.8rem, 8.5vw, 6rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text, #f0ede6);
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.6s forwards;
    }

    /* "Review" — roman, slightly lighter */
    .lr-review {
      font-size: clamp(2.8rem, 8.5vw, 6rem);
      font-weight: 300;
      font-style: normal;
      color: var(--text-secondary, rgba(240,237,230,0.7));
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.72s forwards;
    }

    /* rule */
    .lr-rule {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, var(--primary, #c9b99a), transparent);
      margin: 2.2rem auto;
      opacity: 0;
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.85s forwards;
    }

    /* search */
    .lr-search-wrap {
      width: min(520px, 88vw);
      opacity: 0;
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.95s forwards;
    }

    .lr-search {
      display: flex; align-items: center;
      /* borrow --glass and --border from variables.css */
      background: var(--glass, rgba(255,255,255,0.04));
      border: 1px solid var(--border, rgba(255,255,255,0.08));
      border-radius: 3px;
      padding: 0 1rem;
      gap: 0.7rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .lr-search:focus-within {
      border-color: var(--primary, #c9b99a);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary, #c9b99a) 15%, transparent);
    }

    .lr-search svg {
      flex-shrink: 0;
      color: var(--primary, #c9b99a);
      opacity: 0.5;
    }

    .lr-search input {
      flex: 1; border: none; outline: none;
      background: transparent;
      color: var(--text, #f0ede6);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      padding: 0.9rem 0;
      caret-color: var(--primary, #c9b99a);
    }

    .lr-search input::placeholder {
      color: var(--text-secondary, rgba(240,237,230,0.3));
    }

    /* pills */
    .lr-pills {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 0.45rem;
      margin-top: 1.4rem;
      opacity: 0;
      animation: lrFadeUp 0.9s cubic-bezier(.22,1,.36,1) 1.1s forwards;
    }

    .lr-pill {
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary, rgba(240,237,230,0.45));
      border: 1px solid var(--border, rgba(255,255,255,0.08));
      padding: 0.3rem 0.75rem;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.18s, border-color 0.18s, background 0.18s;
      user-select: none;
      background: transparent;
    }

    .lr-pill:hover {
      color: var(--primary, #c9b99a);
      border-color: var(--primary, #c9b99a);
      background: color-mix(in srgb, var(--primary, #c9b99a) 8%, transparent);
    }

    /* keyframes */
    @keyframes lrFadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lr-eyebrow, .lr-line, .lr-rule, .lr-search-wrap, .lr-pills {
        animation: none; opacity: 1;
      }
    }
  </style>
</head>

<body>

<!-- topo (unchanged from original) -->
<div class="topo-layer" aria-hidden="true">
  <svg viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="currentColor" stroke-width=".8">
      <ellipse cx="500" cy="380" rx="490" ry="340"/>
      <ellipse cx="500" cy="380" rx="430" ry="290"/>
      <ellipse cx="500" cy="380" rx="365" ry="238" stroke-width="1.4"/>
      <ellipse cx="500" cy="380" rx="298" ry="188"/>
      <ellipse cx="500" cy="380" rx="230" ry="140"/>
      <ellipse cx="500" cy="380" rx="164" ry="96" stroke-width="1.4"/>
      <ellipse cx="500" cy="380" rx="100" ry="56"/>
      <ellipse cx="500" cy="380" rx="46" ry="24"/>
      <line x1="0" y1="250" x2="1000" y2="250" stroke-dasharray="2,20"/>
      <line x1="0" y1="500" x2="1000" y2="500" stroke-dasharray="2,20"/>
      <line x1="333" y1="0" x2="333" y2="750" stroke-dasharray="2,20"/>
      <line x1="666" y1="0" x2="666" y2="750" stroke-dasharray="2,20"/>
    </g>
  </svg>
</div>

<div class="scroll-indicator" aria-hidden="true"><div class="scroll-progress"></div></div>
<div class="bg-pattern" aria-hidden="true"></div>

<header class="header" id="header"></header>

<!-- ─────────────────────────────────────
     MAIN — only the inner content is new
───────────────────────────────────── -->
<main class="landing-stage" aria-label="AI Tools for Literature Review">

  <p class="lr-eyebrow">ukubona · to see · to know</p>

  <h1 class="lr-headline" aria-label="AI Tools for Literature Review">
    <span class="lr-line lr-ai">AI</span>
    <span class="lr-line lr-tools">Tools</span>
    <span class="lr-line lr-for">for</span>
    <span class="lr-line lr-lit">Literature</span>
    <span class="lr-line lr-review">Review</span>
  </h1>

  <div class="lr-rule" aria-hidden="true"></div>

  <div class="lr-search-wrap" role="search">
    <div class="lr-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
           aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search"
             placeholder="search a tool, method, or topic…"
             aria-label="Search AI tools for literature review"
             autocomplete="off" spellcheck="false">
    </div>

</main>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<script src="ukhona/js/shared.js"></script>
</body>
</html>
